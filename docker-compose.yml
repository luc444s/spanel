services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      WORKERS: ${WORKERS:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - apps_state:/var/lib/spanel/apps
      - ${SPANEL_APPS_ENCRYPTION_KEY_PATH:-./secrets/apps_key}:/run/secrets/apps_key:ro
      - hosting_backups:/var/lib/spanel/hosting-backups
      # Estado del agente de certificados de correo (A.SPEC 0035/0036).
      # La app solo lee state/jobs y escribe requests; nunca claves privadas.
      - /var/lib/spanel/cert-manager:/var/lib/spanel/cert-manager
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.spanel-http.entrypoints=web"
      - "traefik.http.routers.spanel-http.rule=Host(`spanel.systutor.com`)"
      - "traefik.http.routers.spanel.entrypoints=websecure"
      - "traefik.http.routers.spanel.rule=Host(`spanel.systutor.com`)"
      - "traefik.http.routers.spanel.tls=true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  apps-worker:
    build: .
    command: ["dramatiq", "plugins.apps.backend.tasks", "--processes", "1", "--threads", "1", "--queues", "apps"]
    env_file:
      - .env.docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - apps_state:/var/lib/spanel/apps
      - ${SPANEL_APPS_ENCRYPTION_KEY_PATH:-./secrets/apps_key}:/run/secrets/apps_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  hosting_backups:
  apps_state:

networks:
  proxy:
    external: true
