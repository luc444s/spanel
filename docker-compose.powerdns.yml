services:
  app:
    environment:
      SPANEL_PDNS_API_URL: ${SPANEL_PDNS_API_URL:?Set SPANEL_PDNS_API_URL}
      SPANEL_PDNS_API_KEY_FILE: /run/secrets/pdns_api_key
      SPANEL_PDNS_SERVER_ID: ${SPANEL_PDNS_SERVER_ID:-localhost}
      SPANEL_PDNS_TIMEOUT_SECONDS: ${SPANEL_PDNS_TIMEOUT_SECONDS:-5}
    volumes:
      - ${SPANEL_PDNS_API_KEY_PATH:?Set SPANEL_PDNS_API_KEY_PATH}:/run/secrets/pdns_api_key:ro
    networks:
      - default
      - proxy
      - powerdns

networks:
  powerdns:
    external: true
    name: spanel-powerdns-lab-net
