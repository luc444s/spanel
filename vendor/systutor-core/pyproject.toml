[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systutor-core"
version = "0.1.0"
description = "Kernel open source de SYSTUTOR: auth, RBAC, multi-tenancy, auditoria, eventos y runtime de plugins"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.13,<2.0",
  "psycopg>=3.1,<4.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.0,<6.0",
  "dramatiq[redis]>=1.17,<2.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "pyright>=1.1.0",
  "ruff>=0.5.0",
]
termux-dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "pyright>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/systutor/api/v1/system.py" = ["B008"]
"src/systutor/api/v1/core/*.py" = ["B008"]
"src/systutor/kernel/auth/dependencies.py" = ["B008"]
"src/systutor/kernel/auth/router.py" = ["B008"]
"../../plugins/*/backend/router.py" = ["B008"]

[tool.pyright]
include = ["src", "tests", "app"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
